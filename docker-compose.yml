version: '3.8'

services:
  # =============================================================================
  # PostgreSQL 16 Enterprise Relational Database
  # =============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: workforceiq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workforce_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workforce_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-workforce_iq}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - workforce_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workforce_user} -d ${POSTGRES_DB:-workforce_iq}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =============================================================================
  # FastAPI Enterprise Intelligence Backend
  # =============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: workforceiq_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: WorkforceIQ
      APP_VERSION: 1.0.0
      ENVIRONMENT: production
      DEBUG: "false"
      API_V1_STR: /api/v1
      HOST: 0.0.0.0
      PORT: 8000
      SECRET_KEY: ${SECRET_KEY:-workforceiq-super-secret-development-key-change-in-production-2026}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      BACKEND_CORS_ORIGINS: '["http://localhost", "http://localhost:80", "http://localhost:5173", "http://localhost:3000"]'
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-workforce_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workforce_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-workforce_iq}
      DB_FALLBACK_SQLITE: "false"
      DB_POOL_SIZE: 15
      DB_MAX_OVERFLOW: 25
      DB_POOL_TIMEOUT: 30
      DB_POOL_RECYCLE: 1800
    ports:
      - "8000:8000"
    networks:
      - workforce_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # =============================================================================
  # React + Vite Production Frontend (Nginx Reverse Proxy)
  # =============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: workforceiq_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "5173:80"
    networks:
      - workforce_net
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  workforce_net:
    driver: bridge

volumes:
  postgres_data:
    name: workforceiq_postgres_data

